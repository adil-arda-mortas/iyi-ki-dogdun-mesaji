<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İyi ki doğdun Nehir!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,700&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#1b1340;--bg2:#4a1f5e;--ink:#fff4e6;--cake1:#ffd6e7;--cake2:#ff9fc4;--cake3:#fff;--wax:#ffd36b;--soft:#ffc9de;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#120c2e;--bg2:#3a1750}}
:root[data-theme="dark"]{--bg1:#120c2e;--bg2:#3a1750}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Caveat","Segoe Script",cursive;
  background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg1) 70%) fixed var(--bg1);overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:0 20px 48px;text-align:center;position:relative;z-index:1}
.bunting{display:block;width:calc(100% + 40px);margin:0 -20px 4px}
h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(2.4rem,11vw,3.4rem);
  line-height:1.05;margin:8px 0 0;color:var(--wax);text-shadow:0 0 24px rgba(255,211,107,.45)}
h1 span{display:inline-block;opacity:0;transform:translateY(24px) rotate(-4deg);animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.cake{width:min(86vw,340px);margin:18px auto 0;display:block;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate;transition:transform .35s,opacity .35s}
.flame:nth-of-type(2n){animation-duration:.45s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.12) rotate(4deg)}}
.out .flame{animation:none;transform:scale(0);opacity:0}
.smoke{opacity:0;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}
.out .smoke{animation:puff 1.6s ease-out forwards}
@keyframes puff{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
button{font:700 1.7rem "Caveat","Segoe Script",cursive;color:#3a1750;background:var(--wax);border:0;border-radius:999px;
  padding:10px 30px;margin-top:18px;box-shadow:0 6px 0 #c99a2e,0 10px 24px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #c99a2e}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{opacity:.8;font-size:1.25rem;margin:10px 0 0}
.reveal{margin-top:6px;opacity:0;visibility:hidden;max-height:0;overflow:hidden;transition:opacity 1s .6s}
.bloom .reveal{opacity:1;visibility:visible;max-height:900px}
.bloom button,.bloom .hint{display:none}
.lilies{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:14px 0 4px}
.lily{width:34%;max-width:150px;transform:scale(0);transform-origin:50% 100%;transition:transform 1.4s cubic-bezier(.2,1.3,.4,1)}
.lily.m{width:40%;max-width:175px;margin:0 -4%;transition-delay:.3s}
.lily.l{transform-origin:50% 100%;transition-delay:.7s}
.lily.r{transition-delay:1s}
.bloom .lily{transform:scale(1)}
.petals{transform-box:fill-box;transform-origin:50% 50%}
.bloom .petals{animation:sway 5s ease-in-out 2s infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.big{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.9rem;color:var(--soft);margin:6px 0 10px}
.msg{font-size:1.75rem;line-height:1.3;margin:0 auto;max-width:20em}
.heart{display:inline-block;color:#ff6b9a;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.b{position:absolute;width:44px;height:56px;border-radius:50% 50% 48% 48%;opacity:.9;animation:bob 5s ease-in-out infinite alternate}
.b::before{content:"";position:absolute;left:12px;top:9px;width:9px;height:14px;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(25deg)}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:90px;background:rgba(255,255,255,.5)}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-26px) rotate(3deg)}}
.st{position:absolute;color:#ffe9a8;opacity:.2;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:1;transform:scale(1.5)}}
h1 .name{display:block;font-size:clamp(3.6rem,20vw,5.6rem);line-height:1.1;margin-top:2px;color:#ffd36b;
  background:linear-gradient(90deg,#ffd36b,#fff6cf,#ff9fc4,#ffd36b) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,211,107,.5));animation:pop .6s .7s cubic-bezier(.2,1.4,.4,1) forwards,shine 4s linear infinite}
.name::before,.name::after{content:"✦";font-size:.32em;vertical-align:middle;margin:0 .4em;-webkit-text-fill-color:#ffd36b}
@keyframes shine{to{background-position:250% 0}}
@media (prefers-reduced-motion:reduce){
  .flame,.petals,.heart,h1 span,.b,.st{animation:none!important}
  h1 span{opacity:1;transform:none}
  .lily{transition:none}
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <div class="b" style="left:3%;top:34%;background:#ff6b9a"></div>
  <div class="b" style="left:10%;top:62%;background:#7fd6ff;animation-delay:-2s"></div>
  <div class="b" style="right:4%;top:26%;background:#ffd36b;animation-delay:-1s"></div>
  <div class="b" style="right:11%;top:58%;background:#b79bff;animation-delay:-3s"></div>
</div>
<main id="card">
  <svg class="bunting" viewBox="0 0 400 70" aria-hidden="true">
    <path d="M0 6Q200 50 400 6" stroke="#ffe9a8" stroke-width="2" fill="none"/>
    <g transform="translate(40 14)"><polygon points="-14,0 14,0 0,30" fill="#ff6b9a"/></g>
    <g transform="translate(80 20)"><polygon points="-14,0 14,0 0,30" fill="#ffd36b"/></g>
    <g transform="translate(120 24)"><polygon points="-14,0 14,0 0,30" fill="#7fd6ff"/></g>
    <g transform="translate(160 27)"><polygon points="-14,0 14,0 0,30" fill="#b79bff"/></g>
    <g transform="translate(200 28)"><polygon points="-14,0 14,0 0,30" fill="#ff6b9a"/></g>
    <g transform="translate(240 27)"><polygon points="-14,0 14,0 0,30" fill="#ffd36b"/></g>
    <g transform="translate(280 24)"><polygon points="-14,0 14,0 0,30" fill="#7fd6ff"/></g>
    <g transform="translate(320 20)"><polygon points="-14,0 14,0 0,30" fill="#b79bff"/></g>
    <g transform="translate(360 14)"><polygon points="-14,0 14,0 0,30" fill="#ff6b9a"/></g>
  </svg>
  <h1 aria-label="İyi ki doğdun Nehir!"><span style="animation-delay:.1s">İyi</span> <span style="animation-delay:.3s">ki</span> <span style="animation-delay:.5s">doğdun</span><span class="name">Nehir</span></h1>

  <svg class="cake" viewBox="0 0 300 250" role="img" aria-label="Mumlu doğum günü pastası">
    <g id="candles">
      <g fill="#7fd6ff"><rect x="78" y="54" width="9" height="40" rx="2"/><rect x="114" y="54" width="9" height="40" rx="2"/><rect x="146" y="54" width="9" height="40" rx="2"/><rect x="178" y="54" width="9" height="40" rx="2"/><rect x="214" y="54" width="9" height="40" rx="2"/></g>
      <g fill="#fff" opacity=".55"><rect x="80" y="62" width="5" height="4"/><rect x="116" y="70" width="5" height="4"/><rect x="148" y="62" width="5" height="4"/><rect x="180" y="70" width="5" height="4"/><rect x="216" y="62" width="5" height="4"/></g>
      <g>
        <path class="flame" d="M82.5 28c7 9 7 18 0 24-7-6-7-15 0-24z" fill="#ffb02e"/>
        <path class="flame" d="M118.5 28c7 9 7 18 0 24-7-6-7-15 0-24z" fill="#ffb02e"/>
        <path class="flame" d="M150.5 28c7 9 7 18 0 24-7-6-7-15 0-24z" fill="#ffb02e"/>
        <path class="flame" d="M182.5 28c7 9 7 18 0 24-7-6-7-15 0-24z" fill="#ffb02e"/>
        <path class="flame" d="M218.5 28c7 9 7 18 0 24-7-6-7-15 0-24z" fill="#ffb02e"/>
      </g>
      <g>
        <path class="smoke" d="M82 50c-6-8 6-14 0-24"/><path class="smoke" d="M118 50c-6-8 6-14 0-24"/><path class="smoke" d="M150 50c-6-8 6-14 0-24"/><path class="smoke" d="M182 50c-6-8 6-14 0-24"/><path class="smoke" d="M218 50c-6-8 6-14 0-24"/>
      </g>
    </g>
    <rect x="58" y="92" width="184" height="62" rx="12" fill="var(--cake1)"/>
    <path d="M58 104c0-8 8-12 14-12h156c6 0 14 4 14 12 0 14-12 14-18 6s-12-8-16 2-14 10-18 0-12-8-16 0-14 10-18 0-12-8-16 0-14 10-18 0-12-8-16 0-18 6-18-8z" fill="var(--cake3)"/>
    <g fill="#ff6b9a"><circle cx="86" cy="140" r="4"/><circle cx="118" cy="144" r="4"/><circle cx="150" cy="140" r="4"/><circle cx="182" cy="144" r="4"/><circle cx="214" cy="140" r="4"/></g>
    <rect x="30" y="154" width="240" height="72" rx="14" fill="var(--cake2)"/>
    <path d="M30 168c0-8 6-14 14-14h212c8 0 14 6 14 14 0 12-10 12-16 5s-12-7-16 3-14 10-18 0-12-8-16 0-14 10-18 0-12-8-16 0-14 10-18 0-12-8-16 0-14 10-18 0-12-8-16 0-16 4-16-8z" fill="var(--cake3)"/>
    <text x="150" y="205" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="26" fill="#7a1c4b">Nice mutlu yıllara</text>
    <ellipse cx="150" cy="232" rx="140" ry="9" fill="#fff" opacity=".85"/>
    <ellipse cx="150" cy="232" rx="140" ry="9" fill="none" stroke="#ffd36b" stroke-width="2"/>
  </svg>

  <button id="blow" type="button">Mumları üfle 🎂</button>
  <p class="hint">Dileğini tut, sonra dokun</p>

  <section class="reveal" aria-live="polite">
    <div class="lilies" aria-hidden="true">
      <svg class="lily l" viewBox="0 0 160 250"><use href="#lily"/></svg>
      <svg class="lily m" viewBox="0 0 160 250"><use href="#lily"/></svg>
      <svg class="lily r" viewBox="0 0 160 250"><use href="#lily"/></svg>
    </div>
    <p class="big">Nice mutlu yıllara, Nehir! 🎉</p>
    <p class="msg">Nehir, yeni yaşın sana sağlık, mutluluk ve başarı getirsin! <span class="heart">♥</span></p>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7fb0"/><stop offset=".55" stop-color="#ffc2da"/><stop offset="1" stop-color="#fff0f6"/></linearGradient>
    <g id="lily">
      <path d="M80 84C82 150 78 200 80 250" stroke="#4fbf7a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M80 190c-26-6-44-24-48-44 24 2 42 18 48 44z" fill="#3fae6c"/>
      <path d="M80 216c24-4 40-20 46-40-22 0-40 14-46 40z" fill="#52c27f"/>
      <g class="petals" transform="translate(80 84)">
        <g id="pt"><path d="M0 0C-17-18-15-52 0-68 15-52 17-18 0 0z" fill="url(#pg)" stroke="#ff7fb0" stroke-width="1"/><path d="M0-6V-54" stroke="#ff7fb0" stroke-width="1.2" opacity=".6"/></g>
        <use href="#pt" transform="rotate(60)"/><use href="#pt" transform="rotate(120)"/><use href="#pt" transform="rotate(180)"/><use href="#pt" transform="rotate(240)"/><use href="#pt" transform="rotate(300)"/>
        <g stroke="#b5532b" stroke-width="2" stroke-linecap="round"><path d="M0 0L-14-24"/><path d="M0 0L-5-30"/><path d="M0 0L6-30"/><path d="M0 0L15-23"/></g>
        <g fill="#ffb02e"><circle cx="-14" cy="-25" r="3.2"/><circle cx="-5" cy="-31" r="3.2"/><circle cx="6" cy="-31" r="3.2"/><circle cx="15" cy="-24" r="3.2"/></g>
      </g>
    </g>
  </defs>
</svg>

<canvas id="fx"></canvas>
<script>
(function(){
  var card=document.getElementById('card'),btn=document.getElementById('blow'),
      cv=document.getElementById('fx'),cx=cv.getContext('2d'),parts=[],run=false,
      still=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
  size();addEventListener('resize',size);
  var cols=['#ffd36b','#ff6b9a','#7fd6ff','#b79bff','#7ee0a0','#fff'];
  function burst(){
    var n=still?0:140,d=devicePixelRatio;
    for(var i=0;i<n;i++){
      parts.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*16-4)*d,
        w:(5+Math.random()*6)*d,h:(8+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:cols[i%cols.length],life:0});
    }
    if(!run){run=true;requestAnimationFrame(tick)}
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    var d=devicePixelRatio;
    parts=parts.filter(function(p){return p.y<cv.height+40&&p.life<260});
    parts.forEach(function(p){
      p.life++;p.vy+=.35*d;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(parts.length)requestAnimationFrame(tick);else run=false;
  }
  var deco=document.querySelector('.deco'),sy=['✦','✧','★','✿'];
  for(var k=0;k<24;k++){var s=document.createElement('span');s.className='st';s.textContent=sy[k%4];
    s.style.cssText='left:'+(Math.random()*96)+'%;top:'+(Math.random()*96)+'%;font-size:'+(10+Math.random()*14)+'px;animation-delay:-'+(Math.random()*3)+'s';deco.appendChild(s)}
  btn.addEventListener('click',function(){
    card.classList.add('out');
    burst();
    setTimeout(function(){card.classList.add('bloom');setTimeout(burst,900)},700);
  });
})();
</script>
</body>
</html>
